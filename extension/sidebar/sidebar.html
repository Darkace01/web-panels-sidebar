<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zen Sidebar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body data-rail="left">
  <div id="app">
    <nav id="rail" aria-label="Panels"></nav>
    <main id="stage">
      <form id="search" role="search">
        <button type="button" id="back" class="tool" title="Back" aria-label="Back" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" id="forward" class="tool" title="Forward" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <input id="q" type="search" placeholder="Search or enter address" aria-label="Search or enter address" autocomplete="off" spellcheck="false">
        <button type="button" id="refresh" class="tool" title="Reload page" aria-label="Reload page" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <div id="suggest" role="listbox" hidden></div>
      </form>
      <div id="frames"></div>
      <p id="empty"></p>
    </main>
  </div>

  <dialog id="edit-dialog">
    <form method="dialog" id="edit-form">
      <h3 id="edit-heading">Add web panel</h3>
      <label>Name <input id="f-name" type="text" autocomplete="off"></label>
      <label>Address <input id="f-url" type="text" placeholder="https://example.com" autocomplete="off"></label>
      <label class="row"><input id="f-mobile" type="checkbox"> Request the mobile version of sites</label>
      <label class="row"><input id="f-keep" type="checkbox"> Keep loaded (never unload when idle)</label>
      <label class="row"><input id="f-notify" type="checkbox"> Desktop notification when unread count rises</label>
      <p id="edit-error" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" id="edit-cancel">Cancel</button>
        <button type="submit" id="edit-save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h3>Sidebar settings</h3>
      <label>Rail position
        <select id="s-rail">
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </label>
      <label>Unload idle panels after (minutes, 0 = never)
        <input id="s-unload" type="number" min="0" step="1">
      </label>
      <label class="row"><input id="s-autoclose" type="checkbox"> Close the panel view when I click the page</label>
      <div class="actions left">
        <button type="button" id="s-export">Export panels</button>
        <button type="button" id="s-import">Import panels…</button>
        <input id="s-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="s-msg" class="note" role="status"></p>
      <div class="actions">
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="../lib/store.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
